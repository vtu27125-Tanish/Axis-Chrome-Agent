<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Axis AI</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

<div id="app">

    <!-- Header -->

    <header class="header">

        <div class="logo">

            🧠 <span>Axis AI</span>

        </div>

        <div id="status-dot"
             class="status-dot disconnected">
        </div>

    </header>

    <!-- Login -->

    <section id="auth-section"
             class="section">

        <button
            id="sign-in-btn"
            class="btn primary">

            Sign in with Google

        </button>

    </section>

    <!-- Main -->

    <section id="main-section"
             class="section hidden">

        <!-- Chat -->

        <div
            id="transcript"
            class="transcript">

            <div class="hint">

                Ask Axis anything...

            </div>

        </div>

        <!-- Input -->

        <div class="chat-input">

            <input

                id="chat-input"

                type="text"

                placeholder="Message Axis..."

            >

            <button id="send-btn">

                ➜

            </button>

        </div>

        <!-- Voice -->

        <button
            id="mic-btn"
            class="mic-btn"
            disabled>

            🎤

        </button>

        <!-- Status -->

        <div class="status-panel">

            <div>

                <strong>Mode</strong>

                <span id="mode-badge">

                    AI Agent

                </span>

            </div>

            <div>

                <strong>Memory</strong>

                <span id="memory-status">

                    Ready

                </span>

            </div>

            <div>

                <strong>Browser</strong>

                <span id="browser-status">

                    Connected

                </span>

            </div>

        </div>

        <!-- Footer -->

        <div class="footer">

            <span id="user-name"></span>

            <button
                id="sign-out-btn"
                class="btn small">

                Sign out

            </button>

        </div>

    </section>

</div>

<script type="module" src="popup.js"></script>

</body>

</html>
